<article class="dashboard-card" [class.p-6]="padded()" [class.p-0]="!padded()">
    <div class="flex items-start justify-between gap-4" [class.p-6]="!padded()" [class.mb-6]="padded()">
        <div>
            <h2 class="text-xl font-bold text-[#1f2a1f]">
                @if (titleKey()) {
                {{ titleKey()! | translate }}
                } @else {
                {{ title() }}
                }
            </h2>

            @if (subtitleKey() || subtitle()) {
            <p class="mt-1 text-sm font-medium text-[#8d877e]">
                @if (subtitleKey()) {
                {{ subtitleKey()! | translate }}
                } @else {
                {{ subtitle() }}
                }
            </p>
            }
        </div>

        @if (action()) {
        @if (action()?.variant === 'icon') {
        <button type="button"
            class="flex h-9 w-9 items-center justify-center rounded-full text-[#8d877e] transition hover:bg-[#f7f4ef]"
            (click)="actionClick.emit()">
            <i [class]="action()?.icon || 'pi pi-ellipsis-h'"></i>
        </button>
        } @else {
        <button type="button"
            class="inline-flex h-11 items-center gap-2 rounded-2xl bg-[#eef4e8] px-5 text-sm font-bold text-[#5f6f43] transition hover:bg-[#e2ecd9]"
            (click)="actionClick.emit()">
            @if (action()?.labelKey) {
            {{ action()?.labelKey! | translate }}
            } @else {
            {{ action()?.label }}
            }

            @if (action()?.icon) {
            <i [class]="action()?.icon + ' text-xs'"></i>
            }
        </button>
        }
        }
    </div>

    <ng-content></ng-content>
</article>
