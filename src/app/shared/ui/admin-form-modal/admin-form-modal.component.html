@if (isOpen) {
<div class="fixed inset-0 z-[10000] overflow-hidden bg-black/50 p-3 backdrop-blur-sm sm:p-6" tabindex="-1"
  (click)="onBackdropClick($event)">
  <section class="mx-auto flex h-full min-h-0 w-full items-center justify-center">
    <div
      class="flex max-h-full w-full min-w-0 flex-col overflow-hidden rounded-2xl border border-[#e5ded2] bg-white shadow-xl"
      role="dialog" aria-modal="true" [class.max-w-md]="variant === 'delete' || size === 'sm'"
      [class.max-w-2xl]="variant !== 'delete' && size === 'md'" [class.max-w-3xl]="variant !== 'delete' && size === 'lg'"
      [class.max-w-5xl]="variant !== 'delete' && size === 'xl'">
      <header
        class="z-10 flex shrink-0 items-start justify-between gap-4 border-b border-[#e5ded2] bg-white px-5 py-4 sm:px-6">
        <div class="min-w-0">
          <h2 class="text-xl font-extrabold text-[#1f2a1f]">
            {{ title | translate }}
          </h2>

          @if (subtitle) {
          <p class="mt-1 text-sm font-medium text-[#8d877e]">
            {{ subtitle | translate }}
          </p>
          }
        </div>

        <button type="button"
          class="inline-flex size-9 shrink-0 cursor-pointer items-center justify-center rounded-xl text-[#8d877e] transition-[background-color,color] duration-150 hover:bg-[#f7f4ef] hover:text-[#342f29]"
          (click)="close.emit()" [attr.aria-label]="'COMMON.CLOSE' | translate">
          <i class="pi pi-times"></i>
        </button>
      </header>

      <div class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto overscroll-contain px-5 py-5 sm:px-6">
        @if (isDeleteModal()) {
        <div class="flex flex-col items-center text-center">
          <div class="mb-4 flex size-16 items-center justify-center rounded-2xl bg-[#fff1f0] text-2xl text-[#dc3f35]">
            <i class="pi pi-trash"></i>
          </div>

          @if (message) {
          <p class="max-w-sm text-base font-semibold leading-7 text-[#675f55]">
            {{ message | translate }}
          </p>
          }

          <ng-content></ng-content>
        </div>
        } @else {
        <ng-content></ng-content>
        }
      </div>

      <footer
        class="z-10 flex shrink-0 flex-col-reverse gap-3 border-t border-[#e5ded2] bg-white px-5 py-4 sm:flex-row sm:justify-end sm:px-6">
        <button type="button"
          class="inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-[.875rem] border border-[#e5ded2] bg-white px-4 py-3 text-sm font-bold text-[#342f29] transition-[background-color,opacity] duration-150 hover:bg-[#f7f4ef] disabled:cursor-not-allowed disabled:opacity-65"
          [disabled]="loading" (click)="close.emit()">
          {{ cancelLabel | translate }}
        </button>

        @if (isDeleteModal()) {
        <button type="button"
          class="inline-flex h-11 cursor-pointer items-center justify-center gap-2 rounded-[14px] bg-[#dc3f35] px-[18px] text-sm font-extrabold text-white transition-[background-color,transform,box-shadow] duration-[160ms] enabled:hover:-translate-y-px enabled:hover:bg-[#b42318] enabled:hover:shadow-[0_12px_26px_rgba(220,63,53,0.22)] disabled:cursor-not-allowed disabled:opacity-65"
          [disabled]="loading" (click)="submit.emit()">
          @if (loading) {
          <i class="pi pi-spin pi-spinner text-sm"></i>
          }

          @if (!loading) {
          <i class="pi pi-trash text-sm"></i>
          }

          <span>{{ submitLabel | translate }}</span>
        </button>
        } @else {
        <button type="button"
          class="inline-flex min-h-11 cursor-pointer items-center justify-center gap-2 rounded-[.875rem] bg-[#5f6f43] px-4 py-3 text-sm font-bold text-white transition-[background-color,opacity] duration-150 enabled:hover:bg-[#526139] disabled:cursor-not-allowed disabled:opacity-65"
          [disabled]="loading" (click)="submit.emit()">
          @if (loading) {
          <i class="pi pi-spin pi-spinner text-sm"></i>
          }

          <span>{{ submitLabel | translate }}</span>
        </button>
        }
      </footer>
    </div>
  </section>
</div>
}
