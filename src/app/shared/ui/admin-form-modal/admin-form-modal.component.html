@if (isOpen) {
<div
  class="fixed inset-0 z-[10000] overflow-hidden bg-black/50 p-3 backdrop-blur-sm sm:p-6"
  tabindex="-1"
  (click)="onBackdropClick($event)"
  (keydown.escape)="close.emit()"
>
    <section class="mx-auto flex h-full min-h-0 w-full items-center justify-center">
      <div
        class="flex max-h-full w-full min-w-0 flex-col overflow-hidden rounded-2xl border border-[#e5ded2] bg-white shadow-xl"
        [ngClass]="sizeClass()"
        role="dialog"
        aria-modal="true"
      >
        <header
          class="z-10 flex shrink-0 items-start justify-between gap-4 border-b border-[#e5ded2] bg-white px-5 py-4 sm:px-6"
        >
          <div class="min-w-0">
            <h2 class="text-xl font-extrabold text-[#1f2a1f]">
              {{ title | translate }}
            </h2>

            @if (subtitle) {
              <p class="mt-1 text-sm font-medium text-[#8d877e]">
                {{ subtitle | translate }}
              </p>
            }
          </div>

          <button
            type="button"
            class="admin-modal-icon-button"
            (click)="close.emit()"
            [attr.aria-label]="'COMMON.CLOSE' | translate"
          >
            <i class="pi pi-times"></i>
          </button>
        </header>

        <div
          class="min-h-0 flex-1 overflow-x-hidden overflow-y-auto overscroll-contain px-5 py-5 sm:px-6"
        >
          @if (isDeleteModal()) {
            <div class="flex flex-col items-center text-center">
              <div
                class="mb-4 flex h-16 w-16 items-center justify-center rounded-2xl bg-[#fff1f0] text-2xl text-[#dc3f35]"
              >
                <i class="pi pi-trash"></i>
              </div>

              @if (message) {
                <p class="max-w-sm text-base font-semibold leading-7 text-[#675f55]">
                  {{ message | translate }}
                </p>
              }

              <ng-content></ng-content>
            </div>
          } @else {
            <ng-content></ng-content>
          }
        </div>

        <footer
          class="z-10 flex shrink-0 flex-col-reverse gap-3 border-t border-[#e5ded2] bg-white px-5 py-4 sm:flex-row sm:justify-end sm:px-6"
        >
          <button type="button" class="admin-modal-cancel-button" (click)="close.emit()">
            {{ cancelLabel | translate }}
          </button>

          <button
            type="button"
            [class]="submitButtonClass()"
            [disabled]="loading"
            (click)="submit.emit()"
          >
            @if (loading) {
              <i class="pi pi-spin pi-spinner text-sm"></i>
            }

            @if (isDeleteModal() && !loading) {
              <i class="pi pi-trash text-sm"></i>
            }

            <span>{{ submitLabel | translate }}</span>
          </button>
        </footer>
      </div>
    </section>
  </div>
}
