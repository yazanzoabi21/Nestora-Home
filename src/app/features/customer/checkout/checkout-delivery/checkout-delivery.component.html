<section class="rounded-2xl bg-white p-6 shadow-[0_12px_32px_rgba(52,47,41,0.07)]
         max-[560px]:p-[1.1rem]">
  <h1 class="m-0 text-[1.125rem] font-bold text-[#1f2a1f]">
    {{ 'CUSTOMER.CHECKOUT.DELIVERY.TITLE' | translate }}
  </h1>

  @if (loading()) {
  <div class="mt-[1.3rem] flex items-center justify-center gap-2 rounded-[0.9rem]
             bg-[#f4efe8] p-[1.4rem] font-bold text-[#8a847c]" role="status">
    <i class="pi pi-spin pi-spinner text-[#738665]" aria-hidden="true"></i>

    <span>
      {{
      'CUSTOMER.CHECKOUT.DELIVERY.LOADING'
      | translate
      }}
    </span>
  </div>
  } @else if (error()) {
  <p class="mt-[1.3rem] flex items-center justify-center gap-2 rounded-[0.9rem]
             bg-[#f4efe8] p-[1.4rem] font-bold text-[#8a847c]" role="alert">
    {{ error() }}
  </p>
  } @else {
  <div class="mt-[1.3rem] grid gap-[0.9rem]">
    @for (option of options(); track option.id) {
    <label class="grid cursor-pointer
                 grid-cols-[auto_2.6rem_minmax(0,1fr)_auto]
                 items-center gap-[0.9rem] rounded-[0.9rem]
                 border border-[#e6d6c4] p-4
                 transition-[border-color,background-color]
                 duration-150 ease-in-out
                 hover:border-[#738665] hover:bg-[#f3f6f0]
                 max-[560px]:grid-cols-[auto_2.4rem_minmax(0,1fr)]" [ngClass]="
            selectedId() === option.id
              ? '!border-[#738665] !bg-[#f3f6f0]'
              : ''
          ">
      <input class="h-4 w-4 accent-[#738665]" type="radio" name="delivery" [checked]="selectedId() === option.id"
        (change)="select.emit(option.id)" />

      <span class="inline-flex h-[2.6rem] w-[2.6rem]
                   items-center justify-center rounded-[0.8rem]
                   bg-[#eee5db] text-[#738665]">
        <i [class]="option.icon || 'pi pi-truck'" aria-hidden="true"></i>
      </span>

      <span class="min-w-0">
        <span class="block text-[0.95rem] font-extrabold
                     text-[#1f2a1f]">
          {{ option.name }}
        </span>

        <span class="mt-[0.2rem] block text-[0.82rem]
                     font-bold text-[#8a847c]">
          {{ eta(option) }}
        </span>
      </span>

      <strong class="text-[0.95rem] text-[#1f2a1f]
                   max-[560px]:col-start-3">
        @if (option.calculatedCost) {
        {{
        option.calculatedCost
        | currency: 'USD'
        }}
        } @else {
        {{
        'CUSTOMER.CHECKOUT.DELIVERY.FREE'
        | translate
        }}
        }
      </strong>
    </label>
    } @empty {
    <p class="flex items-center justify-center gap-2 rounded-[0.9rem]
                 bg-[#f4efe8] p-[1.4rem] font-bold text-[#8a847c]">
      {{
      'CUSTOMER.CHECKOUT.DELIVERY.EMPTY'
      | translate
      }}
    </p>
    }
  </div>
  }

  <div class="mt-[1.4rem] flex justify-between gap-[0.85rem]
           max-[560px]:flex-col-reverse">
    <button class="min-h-[2.8rem] rounded-[0.875rem] cursor-pointer
             border border-[#e6d6c4] px-[1.2rem]
             font-extrabold text-[#1f2a1f]
             transition-colors duration-150
             hover:border-[#738665] hover:bg-[#f3f6f0]" type="button" (click)="back.emit()">
      {{ 'CUSTOMER.CHECKOUT.DELIVERY.BACK' | translate }}
    </button>

    <button class="inline-flex min-h-[2.8rem] cursor-pointer items-center
         justify-center gap-2 rounded-[0.875rem]
         bg-[#738665] px-[1.2rem] font-extrabold
         text-white transition-opacity duration-150
         disabled:cursor-not-allowed disabled:opacity-55" type="button" [disabled]="!selectedId()"
      (click)="continue.emit()">
      <span>
        {{
        'CUSTOMER.CHECKOUT.DELIVERY.CONTINUE'
        | translate
        }}
      </span>

      <i class="pi pi-chevron-right rtl:rotate-180" aria-hidden="true"></i>
    </button>
  </div>
</section>
