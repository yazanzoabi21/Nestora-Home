<label class="flex min-w-0 flex-col gap-[0.45rem]">
  <span class="text-start text-xs font-bold text-[#817a71]">
    {{ label() }}

    @if (required()) {
    <span class="text-[#b66b60]" aria-hidden="true">*</span>
    }
  </span>

  @if (type() === 'select') {
  <div class="relative w-full" (click)="$event.stopPropagation()">
    <button class="flex h-11 w-full cursor-pointer items-center
             justify-between rounded-[0.7rem] border
             border-[#e6d6c4] bg-[#fffdfb]
             ps-3.5 pe-2 text-start text-[0.9rem]
             font-semibold text-[#292f27] outline-none
             transition-[border-color,box-shadow,background-color]
             duration-150 ease-out
             hover:border-[#738665]
             focus:border-[#738665] focus:bg-white
             focus:shadow-[0_0_0_3px_rgba(115,134,101,0.12)]
             disabled:cursor-not-allowed disabled:opacity-60" type="button" [id]="name()" [name]="name()"
      [disabled]="disabled()" [attr.aria-expanded]="dropdownOpen()" [attr.aria-invalid]="error() ? 'true' : 'false'"
      [attr.aria-describedby]="
        error() ? name() + '-error' : null
      " aria-haspopup="listbox" (click)="toggleDropdown()">
      <span class="truncate">
        {{ selectedOptionLabel() }}
      </span>

      <span class="pointer-events-none inline-flex h-8 w-8
               shrink-0 items-center justify-center
               rounded-lg bg-[#738665] text-white
               transition-transform duration-200">
        <i class="pi pi-chevron-down text-[0.7rem]
                 transition-transform duration-200" [class.rotate-180]="dropdownOpen()" aria-hidden="true"></i>
      </span>
    </button>

    @if (dropdownOpen()) {
    <div class="absolute start-0 top-[calc(100%+0.4rem)]
               z-50 max-h-56 w-full overflow-y-auto
               rounded-xl border border-[#e6d6c4]
               bg-white p-1.5
               shadow-[0_14px_35px_rgba(52,47,41,0.16)]" role="listbox">
      @for (option of options(); track option.value) {
      <button class="flex w-full cursor-pointer items-center
                   justify-between rounded-lg px-3 py-2.5
                   text-start text-[0.9rem] font-semibold
                   transition-colors duration-150" type="button" role="option" [attr.aria-selected]="
              control().value === option.value
            " [ngClass]="
              control().value === option.value
                ? 'bg-[#f3f6f0] text-[#1f2a1f]'
                : 'text-[#292f27] hover:bg-[#f4efe8]'
            " (click)="selectOption(option.value)">
        <span class="truncate">
          {{ option.label }}
        </span>

        @if (control().value === option.value) {
        <i class="pi pi-check text-xs text-[#738665]" aria-hidden="true"></i>
        }
      </button>
      }
    </div>
    }
  </div>
  } @else {
  <input class="h-11 w-full min-w-0 rounded-[0.7rem] border border-[#e6d6c4]
             bg-[#fffdfb] px-3.5 text-start text-[0.9rem] font-semibold
             text-[#292f27] outline-none
             placeholder:font-medium placeholder:text-[#b8b0a7]
             transition-[border-color,box-shadow,background-color]
             duration-150 ease-out
             focus:border-[#738665] focus:bg-white
             focus:shadow-[0_0_0_3px_rgba(115,134,101,0.12)]
             disabled:cursor-not-allowed disabled:opacity-60" [id]="name()" [name]="name()" [type]="type()"
    [formControl]="control()" [placeholder]="placeholder()" [autocomplete]="autocomplete()" [required]="required()"
    [disabled]="disabled()" [attr.aria-invalid]="error() ? 'true' : 'false'"
    [attr.aria-describedby]="error() ? name() + '-error' : null" />
  }

  @if (error()) {
  <span class="text-start text-xs font-bold text-[#b42318]" [id]="name() + '-error'" role="alert">
    {{ error() }}
  </span>
  }
</label>
