<div class="flex min-w-0 flex-col gap-[0.45rem]">
  <label [for]="name()" class="text-start text-xs font-bold text-[#817a71]">
    {{ label() }}

    @if (required()) {
    <span class="text-[#b66b60]" aria-hidden="true">*</span>
    }
  </label>

  @if (type() === 'select') {
  <select class="h-11 w-full min-w-0 rounded-[0.7rem] border border-[#e6d6c4] bg-[#fffdfb]
    px-3.5 text-start text-[0.9rem] font-semibold text-[#292f27] outline-none
    focus:border-[#738665] focus:shadow-[0_0_0_3px_rgba(115,134,101,0.12)]
    disabled:cursor-not-allowed disabled:opacity-60"
    [id]="name()" [name]="name()" [formControl]="control()" [required]="required()"
    [attr.disabled]="disabled() ? '' : null"
    [attr.aria-invalid]="error() ? 'true' : 'false'"
    [attr.aria-describedby]="error() ? name() + '-error' : null">
    @if (placeholder()) {
      <option value="" disabled>{{ placeholder() }}</option>
    }
    @for (option of options(); track option.value) {
      <option [value]="option.value">{{ option.label }}</option>
    }
  </select>
  } @else {
  <input class="h-11 w-full min-w-0 rounded-[0.7rem] border border-[#e6d6c4]
             bg-[#fffdfb] px-3.5 text-start text-[0.9rem] font-semibold
             text-[#292f27] outline-none
             placeholder:font-medium placeholder:text-[#b8b0a7]
             transition-[border-color,box-shadow,background-color]
             duration-150 ease-out
             focus:border-[#738665] focus:bg-white
             focus:shadow-[0_0_0_3px_rgba(115,134,101,0.12)]
             disabled:cursor-not-allowed disabled:opacity-60" [id]="name()" [name]="name()" [type]="type()"
    [formControl]="control()" [placeholder]="placeholder()" [autocomplete]="autocomplete()" [required]="required()"
    [disabled]="disabled()" [attr.aria-invalid]="error() ? 'true' : 'false'"
    [attr.aria-describedby]="error() ? name() + '-error' : null" />
  }

  @if (error()) {
  <span class="text-start text-xs font-bold text-[#b42318]" [id]="name() + '-error'" role="alert">
    {{ error() }}
  </span>
  }
</div>
