<main class="checkout-page">
  <div class="checkout-page__inner customer-page-container">
    <nav class="checkout-breadcrumb" aria-label="Breadcrumb">
      <a routerLink="/shop">Home</a>
      <span>/</span>
      <a routerLink="/shop/cart">Cart</a>
      <span>/</span>
      <span>Checkout</span>
    </nav>

    @if (state.currentStep() !== 'confirmation') {
      <app-checkout-stepper
        [active]="state.currentStep()"
        [completed]="completedSteps()"
        [canOpenStep]="canOpenStep"
        (stepClick)="state.goToStep($event)"
      />

      <div class="checkout-layout">
        <app-checkout-order-summary
          class="checkout-layout__summary"
          [items]="state.checkoutItems()"
          [totals]="state.totals()"
          [loyaltyPoints]="state.estimatedLoyaltyPoints()"
          [authenticated]="state.isAuthenticated()"
          [cashOnDelivery]="state.isCashOnDelivery()"
        />

        <div class="checkout-layout__main">
          @switch (state.currentStep()) {
            @case ('shipping') {
              <app-checkout-shipping
                [initialValue]="state.shippingInformation()"
                [prefill]="state.shippingPrefill()"
                [authenticated]="state.isAuthenticated()"
                [addresses]="state.addressBook.addresses()"
                [addressesLoading]="state.addressBook.loading()"
                [addressesError]="state.addressBook.error()"
                [selectedAddressId]="state.selectedAddressId()"
                (addressSelect)="selectSavedAddress($event)"
                (newAddress)="state.useNewAddress()"
                (continue)="saveShipping($event)"
              />
            }
            @case ('delivery') {
              <app-checkout-delivery
                [options]="state.shippingMethods()"
                [selectedId]="state.selectedShippingMethod()?.id ?? null"
                [loading]="state.loadingShippingMethods()"
                [error]="state.shippingMethodsError()"
                (select)="selectShippingMethod($event)"
                (back)="state.goToShipping()"
                (continue)="state.goToPayment()"
              />
            }
            @case ('payment') {
              <app-checkout-payment
                [methods]="state.paymentMethods()"
                [selectedId]="state.selectedPaymentMethod()?.id ?? null"
                [total]="state.totals().total"
                [loading]="state.loadingPaymentMethods()"
                [error]="state.paymentMethodsError()"
                [placeOrderError]="state.placeOrderError()"
                [submitting]="state.isPlacingOrder()"
                [canPlaceOrder]="state.canPlaceOrder()"
                (select)="selectPaymentMethod($event)"
                (back)="state.goToDelivery()"
                (placeOrder)="placeOrder()"
              />
            }
          }
        </div>

      </div>
    } @else {
      <app-checkout-confirmation [confirmation]="state.confirmation()" />
    }
  </div>
</main>
