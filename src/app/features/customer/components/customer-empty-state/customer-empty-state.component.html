<section
  class="relative grid min-w-0 overflow-hidden rounded-[1.75rem] border border-[#e8dccf] bg-[radial-gradient(circle_at_22%_48%,rgba(255,255,255,.72),transparent_34%),linear-gradient(110deg,#faf8f5_0%,#fbf9f6_52%,#f7f4ef_100%)] shadow-[0_18px_38px_rgba(31,42,31,.08),inset_0_1px_0_rgba(255,255,255,.85)] md:grid-cols-[minmax(0,.92fr)_minmax(0,1.08fr)]"
  [attr.aria-label]="accessibleLabelKey() ? (accessibleLabelKey() | translate) : null">
  <div
    class="relative z-10 grid min-h-64 place-items-center overflow-hidden px-3 pt-6 sm:min-h-72 sm:px-8 md:min-h-80 md:px-6 md:py-8 lg:min-h-[21rem] lg:px-10"
    aria-hidden="true">
    @switch (variant()) {
    @case ('deals') {
    <div class="relative flex h-[17rem] w-full max-w-[32rem] items-center justify-center sm:h-[19rem] lg:h-[21rem]">
      <span class="absolute bottom-[8%] h-8 w-[70%] rounded-[50%] bg-[#6b5b45]/10 blur-xl" aria-hidden="true"></span>

      <img src="assets/images/nestora-bag-plants-4k.png" alt="" class="relative z-10 h-full w-full object-contain"
        loading="lazy" decoding="async" />
    </div>
    }

    @case ('wishlist') {
    <span
      class="grid size-36 place-items-center rounded-[2.25rem] border border-[#718369]/15 bg-white/70 text-[4.5rem] text-[#6b7d5e] shadow-[0_20px_48px_rgba(31,42,31,.12)] sm:size-40">
      <i class="pi pi-heart"></i>
    </span>
    }

    @case ('orders') {
    <span
      class="grid size-36 place-items-center rounded-[2.25rem] border border-[#718369]/15 bg-white/70 text-[4.5rem] text-[#6b7d5e] shadow-[0_20px_48px_rgba(31,42,31,.12)] sm:size-40">
      <i class="pi pi-receipt"></i>
    </span>
    }

    @case ('search') {
    <span
      class="grid size-36 place-items-center rounded-[2.25rem] border border-[#718369]/15 bg-white/70 text-[4.5rem] text-[#6b7d5e] shadow-[0_20px_48px_rgba(31,42,31,.12)] sm:size-40">
      <i class="pi pi-search"></i>
    </span>
    }

    @default {
    <span
      class="grid size-36 place-items-center rounded-[2.25rem] border border-[#718369]/15 bg-white/70 text-[4.5rem] text-[#6b7d5e] shadow-[0_20px_48px_rgba(31,42,31,.12)] sm:size-40">
      <i class="pi pi-inbox"></i>
    </span>
    }
    }
  </div>

  <div
    class="relative z-10 flex min-w-0 flex-col items-center justify-center px-5 pb-10 text-center sm:px-10 sm:pb-12 md:items-start md:py-12 md:pe-10 md:ps-4 md:text-start lg:pe-16">
    <h3 class="font-serif text-[clamp(2rem,3.1vw,3rem)] font-bold leading-[1.08] tracking-[-.025em] text-[#1f2a1f]">
      {{ titleKey() | translate }}
    </h3>
    <p class="mt-4 max-w-2xl text-[clamp(.95rem,1.35vw,1.08rem)] font-medium leading-7 text-[#6f746e]">
      {{ descriptionKey() | translate }}
    </p>

    @if (actionLabelKey() && actionRouterLink()) {
    <a [routerLink]="actionRouterLink()"
      class="mt-7 inline-flex min-h-13 w-full items-center justify-center gap-4 rounded-xl border-[1.5px] border-[#6b7d5e] bg-white/35 px-7 py-3 text-sm font-extrabold text-[#5f714f] no-underline shadow-[inset_0_1px_0_rgba(255,255,255,.75)] transition duration-200 hover:-translate-y-0.5 hover:bg-[#6b7d5e] hover:text-white hover:shadow-[0_10px_24px_rgba(107,125,94,.22)] focus-visible:outline-2 focus-visible:outline-offset-4 focus-visible:outline-[#6b7d5e] sm:w-auto">
      {{ actionLabelKey() | translate }}
      <i class="pi pi-arrow-right text-xs rtl:rotate-180" aria-hidden="true"></i>
    </a>
    }
  </div>
</section>
