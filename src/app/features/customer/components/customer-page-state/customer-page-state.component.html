@if (kind() === 'loading') {
<div class="mx-auto grid max-w-3xl gap-4" role="status" [attr.aria-label]="titleKey() | translate">
  @for (item of [1, 2, 3]; track item) {
  <div class="animate-pulse rounded-3xl border border-[#e8dccf] bg-white p-6 sm:p-8">
    <div class="h-5 w-40 rounded-full bg-[#e8e4de]"></div>
    <div class="mt-5 h-3 w-full rounded-full bg-[#efebe5]"></div>
    <div class="mt-3 h-3 w-5/6 rounded-full bg-[#efebe5]"></div>
  </div>
  }
</div>
} @else {
<div class="mx-auto max-w-2xl rounded-3xl border border-[#e8dccf] bg-white px-6 py-14 text-center shadow-sm">
  <span class="mx-auto flex h-14 w-14 items-center justify-center rounded-full bg-[#eef1ea] text-[#6b7d5e]">
    <i class="pi text-xl" [class.pi-exclamation-circle]="kind() === 'error'"
      [class.pi-search]="kind() === 'not-found'" [class.pi-inbox]="kind() === 'empty'"></i>
  </span>
  <h2 class="mt-5 text-xl font-black text-[#1f2a1f]">{{ titleKey() | translate }}</h2>
  <p class="mx-auto mt-2 max-w-md text-sm font-semibold leading-6 text-[#77736d]">
    {{ detailKey() | translate }}
  </p>
  @if (kind() === 'error') {
  <button type="button"
    class="mt-6 inline-flex h-11 items-center justify-center rounded-full bg-[#6b7d5e] px-6 text-sm font-black text-white transition hover:bg-[#596b4e] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6b7d5e]"
    (click)="retry.emit()">
    {{ 'CUSTOMERS.HELP.RETRY' | translate }}
  </button>
  } @else if (kind() === 'not-found') {
  <a routerLink="/shop"
    class="mt-6 inline-flex h-11 items-center justify-center rounded-full bg-[#6b7d5e] px-6 text-sm font-black text-white transition hover:bg-[#596b4e] focus-visible:outline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-[#6b7d5e]">
    {{ 'CUSTOMERS.HELP.BACK_HOME' | translate }}
  </a>
  }
</div>
}
