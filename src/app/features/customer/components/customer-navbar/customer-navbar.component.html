<header class="customer-header">
  <div class="benefits-bar">
    <div class="navbar-container benefits-bar__content">
      <span class="benefits-bar__check" aria-hidden="true">
        <i class="pi pi-check"></i>
      </span>
      <span class="benefits-bar__lead">Worry-free shopping</span>
      <span class="benefits-bar__separator" aria-hidden="true">—</span>
      <span class="benefits-bar__pill">30-Day Returns</span>
      <a routerLink="/shop" class="benefits-bar__link">Learn More <span aria-hidden="true">→</span></a>
    </div>
  </div>

  <div class="shipping-bar">
    <span>FREE SHIPPING ON ORDERS OVER $75</span>
    <span class="shipping-bar__dot" aria-hidden="true">·</span>
    <span>USE CODE: NESTORA10 FOR 10% OFF</span>
  </div>

  <nav class="main-navbar" aria-label="Primary navigation">
    <div class="navbar-container main-navbar__content">
      <a routerLink="/shop" class="brand" aria-label="Nestora Home">
        <span class="brand__icon" aria-hidden="true">
          <i class="pi pi-home"></i>
        </span>
        <span class="brand__name">Nestora Home</span>
      </a>

      <div class="navigation">
        @for (link of navLinks; track link.label) {
          <a
            [routerLink]="link.path"
            routerLinkActive="navigation__link--active"
            [routerLinkActiveOptions]="{ exact: link.path === '/shop' }"
            class="navigation__link"
          >
            {{ link.label }}
          </a>
        }
      </div>

      <div class="actions">
        <label class="search-box">
          <span class="sr-only">Search products</span>
          <i class="pi pi-search" aria-hidden="true"></i>
          <input type="search" placeholder="Search home essentials" />
        </label>

        <button type="button" class="customer-icon-button actions__wishlist" aria-label="Wishlist">
          <i class="pi pi-heart"></i>
        </button>
        <button type="button" class="customer-icon-button" aria-label="Cart">
          <i class="pi pi-shopping-bag"></i>
        </button>
        <button type="button" class="customer-icon-button" aria-label="Profile">
          <i class="pi pi-user"></i>
        </button>
      </div>
    </div>
  </nav>
</header>
