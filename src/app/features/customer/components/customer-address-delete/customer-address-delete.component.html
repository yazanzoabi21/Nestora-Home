    title="CUSTOMER.ACCOUNT.ADDRESSES.REMOVE_TITLE" message="CUSTOMER.ACCOUNT.ADDRESSES.REMOVE_TEXT"
    submitLabel="CUSTOMER.ACCOUNT.ADDRESSES.REMOVE" cancelLabel="CUSTOMER.ACCOUNT.ADDRESSES.CANCEL"

}
