<a class="whatsapp-contact" [href]="whatsappUrl()" target="_blank" rel="noopener noreferrer"
  [attr.aria-label]="ariaLabelKey | translate" [attr.title]="ariaLabelKey | translate">
  <span class="whatsapp-contact__icon" aria-hidden="true">
    <i class="pi pi-whatsapp"></i>
  </span>

  <span class="sr-only">
    {{ labelKey | translate }}
  </span>
</a>
