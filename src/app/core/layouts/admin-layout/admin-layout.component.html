<app-sidebar [collapsed]="sidebarCollapsed()" [mobileOpen]="mobileSidebarOpen()"
  (collapsedChange)="sidebarCollapsed.set($event)" (mobileClose)="closeMobileSidebar()"></app-sidebar>

@if (mobileSidebarOpen()) {
<button type="button" class="fixed inset-0 z-[90] cursor-pointer bg-black/50 lg:hidden" aria-label="Close sidebar"
  (click)="closeMobileSidebar()"></button>
}

<div
  class="admin-main min-h-screen w-full min-w-0 max-w-full overflow-x-hidden bg-[#f7f4ef] pt-[72px] transition-[margin] duration-300 lg:w-auto lg:pt-[88px]"
  [class.sidebar-expanded]="!sidebarCollapsed()" [class.sidebar-collapsed]="sidebarCollapsed()">
  <app-topbar [user]="currentUser()" [sidebarCollapsed]="sidebarCollapsed()"
    (menuClick)="openMobileSidebar()"></app-topbar>

  <router-outlet></router-outlet>
</div>
